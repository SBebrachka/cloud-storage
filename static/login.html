<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #050a18;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79,163,255,0.1) 0%, transparent 60%),
                    radial-gradient(ellipse 60% 50% at 80% 90%, rgba(168,85,247,0.1) 0%, transparent 55%);
            pointer-events: none;
        }

        .panel {
            position: relative;
            z-index: 1;
            width: 380px;
            background: rgba(8,18,40,0.9);
            border: 1px solid rgba(80,160,255,0.3);
            border-radius: 16px;
            padding: 32px 28px 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(79,163,255,0.08), 0 20px 60px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dots {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
        }
        .dots i {
            display: block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dots i:nth-child(1) { background: rgba(255,90,90,0.6); }
        .dots i:nth-child(2) { background: rgba(255,200,50,0.5); }
        .dots i:nth-child(3) { background: rgba(79,163,255,0.6); }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 1.5px solid rgba(79,163,255,0.4);
            background: rgba(79,163,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 0 24px rgba(79,163,255,0.15);
            font-size: 28px;
        }

        h2 {
            text-align: center;
            color: #e8f0ff;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.02em;
        }

        .field {
            position: relative;
            margin-bottom: 12px;
        }

        .field input {
            width: 100%;
            background: rgba(10,22,50,0.8);
            border: 1px solid rgba(80,160,255,0.2);
            border-radius: 8px;
            color: #e8f0ff;
            font-family: inherit;
            font-size: 0.9rem;
            padding: 12px 14px 12px 40px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input::placeholder { color: rgba(180,200,255,0.45); }

        .field input:focus {
            border-color: rgba(79,163,255,0.6);
            box-shadow: 0 0 0 3px rgba(79,163,255,0.08);
        }

        .field .ico {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: 0.45;
            pointer-events: none;
        }

        .field .eye {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: 0.45;
            cursor: pointer;
        }
        .field .eye:hover { opacity: 0.8; }

        .error-box {
            display: none;
            color: #ff4d6d;
            font-size: 0.82rem;
            padding: 8px 12px;
            background: rgba(255,77,109,0.08);
            border: 1px solid rgba(255,77,109,0.2);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4fa3ff 0%, #a855f7 100%);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            letter-spacing: 0.04em;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(79,163,255,0.25);
        }

        .btn-main:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(79,163,255,0.35);
        }

        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #4fa3ff;
            text-decoration: none;
            opacity: 0.8;
        }
        .link:hover { opacity: 1; }
    </style>
</head>
<body>
<div class="panel">
    <div class="dots"><i></i><i></i><i></i></div>

    <div class="avatar">👤</div>
    <h2>Вход</h2>

    <div class="field">
        <span class="ico">👤</span>
        <input id="username" type="text" placeholder="Логин" autocomplete="username">
    </div>

    <div class="field">
        <span class="ico">🔒</span>
        <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
        <span class="eye" onclick="togglePwd()">👁</span>
    </div>

    <div class="error-box" id="err"></div>

    <button class="btn-main" id="btn" onclick="doLogin()">Войти</button>
    <a href="/register" class="link">Регистрация</a>
</div>

<script>
    function togglePwd() {
        const p = document.getElementById('password');
        p.type = p.type === 'password' ? 'text' : 'password';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const err = document.getElementById('err');
        const btn = document.getElementById('btn');

        err.style.display = 'none';
        if (!username || !password) { showErr('Заполните все поля'); return; }

        btn.textContent = 'Вход...';
        btn.disabled = true;

        try {
            const res = await fetch('/auth/sign-in', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await res.json();
            if (!res.ok) { showErr(result.message || 'Неверный логин или пароль'); return; }
            localStorage.setItem('token', result.token);
            if (result.user?.name) localStorage.setItem('userName', result.user.name);
            window.location.href = '/home';
        } catch { showErr('Ошибка сети'); }
        finally { btn.textContent = 'Войти'; btn.disabled = false; }
    }

    function showErr(msg) {
        const e = document.getElementById('err');
        e.textContent = msg;
        e.style.display = 'block';
    }
</script>
</body>
</html>
